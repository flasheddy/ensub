[workspace]
resolver = "2"
members = [
  "crates/cli",
  "crates/cosmic_applet",
  "crates/cosmic_gui",
  "crates/core_engine",
  "crates/language_engine",
  "crates/llm_client",
  "crates/sqlite_storage",
  "crates/theme",
  "crates/tui",
  "crates/wasm_bridge",
  "tools/lexicon_builder",
]

[workspace.package]
version = "0.1.0-rc1"
edition = "2021"
authors = ["Chen <326801595@qq.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.16.4"
crossterm = "0.28.1"
dialoguer = { version = "0.12", default-features = false }
dirs = "6.0"
fs2 = "0.4.3"
flate2 = "1.1"
js-sys = "0.3.104"
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "511384f6206527cf87369da67a9164831afbabef", default-features = false }
quick-xml = "0.39"
pulldown-cmark = { version = "0.13", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "underline-color"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6.5"
sentencex = "0.1.30"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2"
ensub-theme = { path = "crates/theme" }
tokio = { version = "1", features = ["process", "rt", "time"] }
unicode-segmentation = "1.13.3"
unicode-width = "=0.2.0"
url = "2.5"
uuid = { version = "1.24", features = ["v5"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-test = "0.3.77"
web-sys = { version = "0.3.104", features = ["DomException", "Storage", "Window"] }
zstd = { version = "0.13.3", default-features = false }

[workspace.metadata.ensub]
reserved-members = [
]
