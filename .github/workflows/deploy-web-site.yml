name: Deploy web site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - crates/web_site/**
      - .github/workflows/deploy-web-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/web_site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install package state
        run: bun install --frozen-lockfile
      - name: Test web application
        run: bun test
      - name: Build static artifact
        run: bun run build
      - name: Verify static artifact
        run: bun run verify:dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/web_site/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
