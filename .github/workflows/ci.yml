name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update
      - run: sudo apt-get install -y cmake libexpat1-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev pkg-config
      - run: sh scripts/verify.sh rust

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0,wasm-bindgen-cli
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update
      - run: sudo apt-get install -y firefox
      - run: sh scripts/verify.sh wasm

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0,wasm-bindgen-cli
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
        working-directory: crates/web_sandbox
      - run: bun install --frozen-lockfile
        working-directory: crates/web_player
      - run: bunx playwright install --with-deps chromium
        working-directory: crates/web_sandbox
      - run: sh scripts/verify.sh web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: clippy
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
      - uses: Swatinem/rust-cache@v2
      - run: sh scripts/verify.sh android

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update
      - run: sudo apt-get install -y appstream cmake desktop-file-utils libexpat1-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev pkg-config util-linux
      - run: sh scripts/verify.sh release-smoke

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --retry 3 --silent --show-error \
            "${release_url}/${archive}" \
            --output "${archive_path}"
          echo "${GITLEAKS_SHA256}  ${archive_path}" | sha256sum --check -
          mkdir -p "${GITHUB_WORKSPACE}/bin"
          tar --extract --gzip \
            --file "${archive_path}" \
            --directory "${GITHUB_WORKSPACE}/bin" \
            gitleaks
          echo "${GITHUB_WORKSPACE}/bin" >> "${GITHUB_PATH}"
      - run: sh scripts/verify.sh secrets
