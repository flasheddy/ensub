<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="description" content="A local-first podcast transcript player.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./styles.css">
  <title>Ensub Player</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Ensub Player home"><span class="brand-mark">E</span><span>Ensub Player</span></a>
      <div class="network-state" id="network-state" role="status">Local workspace</div>
    </header>

    <aside class="library" aria-label="Podcast library">
      <form id="feed-form" class="feed-form">
        <label for="feed-url">Podcast feed</label>
        <div class="feed-input-row">
          <input id="feed-url" name="feed-url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/feed.xml" required>
          <button class="icon-command" type="submit" aria-label="Load podcast feed" title="Load podcast feed">Load</button>
        </div>
      </form>
      <div class="library-heading">
        <h2>Episodes</h2>
        <span id="episode-count" aria-live="polite">0</span>
      </div>
      <div id="episode-list" class="episode-list"></div>
    </aside>

    <main class="reader" id="reader">
      <section id="empty-state" class="empty-state">
        <img src="./assets/demo/cover.png" alt="Synthetic Signal podcast artwork" width="240" height="240">
        <div>
          <h1>Listen with the words in view.</h1>
          <p>Your podcast library and transcripts stay in this browser.</p>
          <button id="demo-button" class="primary-command" type="button">Load Demo Episode</button>
        </div>
      </section>

      <section id="episode-workspace" class="episode-workspace" hidden>
        <header class="episode-header">
          <img id="episode-artwork" src="./assets/demo/cover.png" alt="" width="96" height="96">
          <div class="episode-heading-copy">
            <p id="feed-title" class="feed-title"></p>
            <h1 id="episode-title"></h1>
            <div class="transcript-toolbar">
              <label for="transcript-select">Transcript</label>
              <select id="transcript-select"></select>
              <button id="follow-button" class="secondary-command" type="button">Following</button>
            </div>
          </div>
        </header>
        <div id="transcript-status" class="transcript-status" role="status"></div>
        <div class="reading-grid">
          <div id="transcript" class="transcript" aria-label="Synchronized transcript" tabindex="0"></div>
          <aside id="lookup-inspector" class="lookup-inspector" aria-label="Word lookup" hidden>
            <div class="lookup-heading">
              <div><span id="lookup-surface" class="lookup-surface"></span><span id="lookup-phonetic" class="lookup-phonetic"></span></div>
              <button id="lookup-close" class="lookup-close" type="button" aria-label="Close lookup" title="Close lookup">×</button>
            </div>
            <div id="lookup-body" class="lookup-body" role="status"></div>
            <label id="lookup-choice-label" class="lookup-choice-label" for="lookup-choice" hidden>Lemma</label>
            <select id="lookup-choice" hidden></select>
            <button id="capture-button" class="primary-command lookup-capture" type="button" hidden>Capture</button>
          </aside>
        </div>
      </section>
    </main>

    <footer class="player" aria-label="Audio player">
      <audio id="audio" preload="metadata"></audio>
      <div class="now-playing">
        <img id="player-artwork" src="./assets/demo/cover.png" alt="" width="48" height="48">
        <div><strong id="player-title">No episode selected</strong><span id="player-feed">Ensub Player</span></div>
      </div>
      <div class="transport-controls">
        <div class="button-row">
          <button id="back-button" class="player-button" type="button" aria-label="Back 15 seconds" title="Back 15 seconds">-15</button>
          <button id="play-button" class="play-button" type="button" aria-label="Play" title="Play">Play</button>
          <button id="forward-button" class="player-button" type="button" aria-label="Forward 30 seconds" title="Forward 30 seconds">+30</button>
        </div>
        <div class="timeline-row">
          <span id="elapsed">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position">
          <span id="remaining">-0:00</span>
        </div>
      </div>
      <div class="playback-settings">
        <label for="speed">Speed</label>
        <select id="speed">
          <option value="0.75">0.75x</option><option value="1" selected>1x</option>
          <option value="1.25">1.25x</option><option value="1.5">1.5x</option>
          <option value="1.75">1.75x</option><option value="2">2x</option>
        </select>
        <button id="mute-button" class="player-button" type="button" aria-label="Mute" title="Mute">Mute</button>
        <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      </div>
    </footer>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
