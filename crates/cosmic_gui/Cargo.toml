[package]
name = "ensub-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "ensub_gui"
path = "src/lib.rs"

[[bin]]
name = "ensub-gui"
path = "src/main.rs"

[dependencies]
core_engine = { path = "../core_engine" }
language_engine = { path = "../language_engine", features = ["document"] }
ensub-sqlite = { path = "../sqlite_storage" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
libcosmic = { workspace = true, features = ["a11y", "dbus-config", "single-instance", "tokio", "wayland", "winit", "wgpu", "xdg-portal", "x11"] }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
